<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1f8" />
    <meta
      name="description"
      content="Seu espaço para descobrir mangás e acompanhar cada capítulo da sua história."
    />
    <link rel="icon" type="image/svg+xml" href="/ark.svg" />
    <title>ARK Library — seu próximo capítulo</title>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("ark-library:theme:v1");
        } catch {}
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
